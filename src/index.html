<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Movies</title>
</head>
<body>
<input id="title" placeholder="Title">
<button onclick="save()">Save</button>
<ul id="list"></ul>

<script src="https://cdn.jsdelivr.net/npm/pouchdb@9.0.0/dist/pouchdb.min.js"></script>
<script>
    const local  = new PouchDB('movies_local');
    const remote = new PouchDB('http://admin:admin123@127.0.0.1:5984/movies_schema_a');

    async function render() {
        const { rows } = await local.allDocs({ include_docs: true });
        document.getElementById('list').innerHTML = '';
        rows.forEach(r => {
            const li = document.createElement('li');
            li.textContent = r.doc.title;
            li.onclick = () => local.remove(r.doc).then(render);
            document.getElementById('list').appendChild(li);
        });
    }

    async function save() {
        const title = document.getElementById('title').value;
        if (!title) return;
        await local.put({ _id: 'movie_' + Date.now(), title });
        document.getElementById('title').value = '';
        render();
    }

    local.sync(remote, { live: true, retry: true }).on('change', render);
    render();
</script>
</body>
</html>
